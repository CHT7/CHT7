<svg xmlns="http://www.w3.org/2000/svg" width="440" height="260" viewBox="0 0 440 260" role="img" aria-labelledby="title desc">
  <title id="title">CHT7 GitHub stats</title>
  <desc id="desc">Repository, contribution and language statistics.</desc>
  <defs>
    <linearGradient id="accent" x1="0" x2="1">
      <stop stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#009688"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .heading { fill: #1F2328; font-size: 16px; font-weight: 700; }
    .eyebrow { fill: #7C3AED; font-size: 10px; font-weight: 700; letter-spacing: 1.5px; }
    .value { fill: #1F2328; font-weight: 750; }
    .label { fill: #59636E; font-size: 11px; }
  </style>
  <rect x=".5" y=".5" width="439" height="259" rx="16" fill="#FFFFFF" stroke="#D0D7DE"/>
  <rect x="1" y="1" width="438" height="4" rx="2" fill="url(#accent)"/>
  <circle cx="32" cy="35" r="12" fill="#F6F8FA" stroke="#D0D7DE"/>
  <path d="M36 27a9 9 0 1 0 0 16 10 10 0 1 1 0-16Z" fill="#7C3AED"/>
  <text x="53" y="32" class="eyebrow">CHT7</text>
  <text x="53" y="50" class="heading">GitHub stats</text>
  <g transform="translate(28 82)">
        <text class="value" style="font-size:25px">CHT7</text>
        <text y="23" class="label">GitHub</text>
      </g>
<g transform="translate(230 82)">
        <text class="value" style="font-size:25px">2020</text>
        <text y="23" class="label">On GitHub since</text>
      </g>
<g transform="translate(28 156)">
        <text class="value" style="font-size:25px">JavaScript</text>
        <text y="23" class="label">Top language</text>
      </g>
<g transform="translate(230 156)">
        <text class="value" style="font-size:25px">Vietnam</text>
        <text y="23" class="label">From</text>
      </g>
  <text x="28" y="235" class="label">github.com/CHT7</text>
</svg>
