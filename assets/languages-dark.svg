<svg xmlns="http://www.w3.org/2000/svg" width="440" height="260" viewBox="0 0 440 260" role="img" aria-labelledby="title desc">
  <title id="title">CHT7 language mix</title>
  <desc id="desc">Most used programming languages by repository size.</desc>
  <defs>
    <linearGradient id="accent" x1="0" x2="1">
      <stop stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <clipPath id="bar"><rect x="24" y="67" width="392" height="10" rx="5"/></clipPath>
  </defs>
  <style>
    text { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .heading { fill: #F0F6FC; font-size: 16px; font-weight: 700; }
    .eyebrow { fill: #2DD4BF; font-size: 10px; font-weight: 700; letter-spacing: 1.5px; }
    .language { fill: #F0F6FC; font-size: 12px; font-weight: 600; }
    .percent { fill: #8B949E; font-size: 12px; font-variant-numeric: tabular-nums; }
  </style>
  <rect x=".5" y=".5" width="439" height="259" rx="16" fill="#0D1117" stroke="#30363D"/>
  <rect x="1" y="1" width="438" height="4" rx="2" fill="url(#accent)"/>
  <text x="24" y="31" class="eyebrow">LANGUAGES</text>
  <text x="24" y="51" class="heading">Language mix</text>
  <g clip-path="url(#bar)"><rect x="24.0" y="67" width="209.6" height="10" fill="#e34c26"/><rect x="233.6" y="67" width="152.8" height="10" fill="#f1e05a"/><rect x="386.4" y="67" width="24.7" height="10" fill="#3572A5"/><rect x="411.1" y="67" width="4.6" height="10" fill="#663399"/><rect x="415.7" y="67" width="0.3" height="10" fill="#000080"/></g>
  <g transform="translate(28 112)">
        <circle cx="5" cy="-4" r="5" fill="#e34c26"/>
        <text x="18" class="language">HTML</text>
        <text x="382" text-anchor="end" class="percent">53.5%</text>
      </g>
<g transform="translate(28 141)">
        <circle cx="5" cy="-4" r="5" fill="#f1e05a"/>
        <text x="18" class="language">JavaScript</text>
        <text x="382" text-anchor="end" class="percent">39.0%</text>
      </g>
<g transform="translate(28 170)">
        <circle cx="5" cy="-4" r="5" fill="#3572A5"/>
        <text x="18" class="language">Python</text>
        <text x="382" text-anchor="end" class="percent">6.3%</text>
      </g>
<g transform="translate(28 199)">
        <circle cx="5" cy="-4" r="5" fill="#663399"/>
        <text x="18" class="language">CSS</text>
        <text x="382" text-anchor="end" class="percent">1.2%</text>
      </g>
<g transform="translate(28 228)">
        <circle cx="5" cy="-4" r="5" fill="#000080"/>
        <text x="18" class="language">Lua</text>
        <text x="382" text-anchor="end" class="percent">0.1%</text>
      </g>
</svg>
