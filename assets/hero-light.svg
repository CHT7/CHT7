<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-labelledby="title description">
  <title id="title">Tân — CHT7</title>
  <desc id="description">Independent developer building useful software from Vietnam.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F8F9FD"/>
      <stop offset="1" stop-color="#EEF0FB"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#6957E8"/>
      <stop offset="1" stop-color="#0A9F94"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#7966F2" stop-opacity=".16"/>
      <stop offset="1" stop-color="#7966F2" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#1C2140" stroke-opacity=".045"/>
    </pattern>
  </defs>
  <style>
    text { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 2.4px; fill: #667085; }
    .name { font-size: 58px; font-weight: 800; letter-spacing: -2px; fill: #171927; }
    .tagline { font-size: 17px; fill: #5F687C; }
    .pill { font-size: 10px; font-weight: 700; letter-spacing: 1px; fill: #34384A; }
    .mono { font-size: 31px; font-weight: 800; fill: #171927; }
  </style>
  <rect width="900" height="280" rx="24" fill="url(#background)"/>
  <rect width="900" height="280" rx="24" fill="url(#grid)"/>
  <circle cx="790" cy="34" r="260" fill="url(#glow)"/>
  <path d="M574 0h326v280H701c-40-56-58-111-51-165 6-43-19-80-76-115Z" fill="#E9EBF6" fill-opacity=".75"/>
  <path d="M680 216 840 56" stroke="url(#accent)" stroke-width="2" stroke-opacity=".48"/>
  <path d="m718 232 138-138" stroke="#0A9F94" stroke-opacity=".14"/>
  <g transform="translate(60 51)">
    <circle cx="6" cy="6" r="6" fill="#0A9F94"/>
    <text x="22" y="11" class="eyebrow">BUILDING FROM VIETNAM</text>
    <text x="0" y="91" class="name">TÂN / CHT7</text>
    <text x="2" y="125" class="tagline">Useful software. Thoughtful automation. Constant iteration.</text>
    <g transform="translate(0 151)">
      <g><rect width="108" height="30" rx="15" fill="#FFFFFF" stroke="#D8DCE8"/><text x="54" y="19" text-anchor="middle" class="pill">JAVASCRIPT</text></g>
      <g transform="translate(118)"><rect width="80" height="30" rx="15" fill="#FFFFFF" stroke="#D8DCE8"/><text x="40" y="19" text-anchor="middle" class="pill">PYTHON</text></g>
      <g transform="translate(208)"><rect width="60" height="30" rx="15" fill="#FFFFFF" stroke="#D8DCE8"/><text x="30" y="19" text-anchor="middle" class="pill">LUA</text></g>
      <g transform="translate(278)"><rect width="112" height="30" rx="15" fill="#FFFFFF" stroke="#D8DCE8"/><text x="56" y="19" text-anchor="middle" class="pill">AUTOMATION</text></g>
    </g>
  </g>
  <g transform="translate(708 77)">
    <rect width="132" height="132" rx="34" fill="#FFFFFF" stroke="#CFD4E3"/>
    <rect x="12" y="12" width="108" height="108" rx="27" fill="none" stroke="url(#accent)" stroke-width="2"/>
    <text x="66" y="79" text-anchor="middle" class="mono">C7</text>
    <circle cx="105" cy="27" r="5" fill="#0A9F94"/>
  </g>
  <rect y="276" width="900" height="4" rx="2" fill="url(#accent)"/>
</svg>
