<svg xmlns="http://www.w3.org/2000/svg" width="900" height="245" viewBox="0 0 900 245" role="img" aria-labelledby="title description">
  <title id="title">CHT7 GitHub statistics</title>
  <desc id="description">Aggregate repository, contribution, and star statistics.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#8B7CFF"/>
      <stop offset="1" stop-color="#38D6C7"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 1.5px; fill: #8F98AE; }
    .status { font-size: 10px; font-weight: 700; letter-spacing: 1px; fill: #8B7CFF; }
    .metric { font-size: 32px; font-weight: 750; fill: #F5F7FF; }
    .label { font-size: 10px; font-weight: 700; letter-spacing: 1px; fill: #F5F7FF; }
    .detail { font-size: 10px; fill: #8F98AE; }
    .note { font-size: 11px; fill: #8F98AE; }
  </style>
  <rect width="900" height="245" rx="22" fill="#090B13"/>
  <rect width="900" height="4" rx="2" fill="url(#accent)"/>
  <text x="30" y="42" class="eyebrow">GITHUB / CHT7</text>
  <g transform="translate(708 23)">
    <rect width="162" height="28" rx="14" fill="#111522" stroke="#252B3D"/>
    <circle cx="15" cy="14" r="4" fill="#8F98AE"/>
    <text x="27" y="18" class="status">PUBLIC FALLBACK</text>
  </g>

        <g transform="translate(30 70)">
          <rect width="195" height="115" rx="16" fill="#111522" stroke="#252B3D"/>
          <rect x="16" y="18" width="28" height="4" rx="2" fill="#8B7CFF"/>
          <text x="16" y="64" class="metric">6+</text>
          <text x="16" y="87" class="label">TOTAL REPOSITORIES</text>
          <text x="16" y="104" class="detail">minimum known</text>
        </g>
        <g transform="translate(245 70)">
          <rect width="195" height="115" rx="16" fill="#111522" stroke="#252B3D"/>
          <rect x="16" y="18" width="28" height="4" rx="2" fill="#38D6C7"/>
          <text x="16" y="64" class="metric">6</text>
          <text x="16" y="87" class="label">PUBLIC PROJECTS</text>
          <text x="16" y="104" class="detail">visible to everyone</text>
        </g>
        <g transform="translate(460 70)">
          <rect width="195" height="115" rx="16" fill="#111522" stroke="#252B3D"/>
          <rect x="16" y="18" width="28" height="4" rx="2" fill="#8B7CFF"/>
          <text x="16" y="64" class="metric">0</text>
          <text x="16" y="87" class="label">CONTRIBUTIONS</text>
          <text x="16" y="104" class="detail">last 12 months</text>
        </g>
        <g transform="translate(675 70)">
          <rect width="195" height="115" rx="16" fill="#111522" stroke="#252B3D"/>
          <rect x="16" y="18" width="28" height="4" rx="2" fill="#38D6C7"/>
          <text x="16" y="64" class="metric">1</text>
          <text x="16" y="87" class="label">PUBLIC STARS</text>
          <text x="16" y="104" class="detail">across owned repos</text>
        </g>
  <text x="450" y="220" text-anchor="middle" class="note">Add PROFILE_TOKEN to include private repositories; public data is shown for now.</text>
</svg>
