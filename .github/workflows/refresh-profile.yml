name: Refresh profile metrics

on:
  push:
    branches:
      - main
    paths:
      - scripts/update-profile.mjs
      - .github/workflows/refresh-profile.yml
  schedule:
    - cron: "23 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-metrics
  cancel-in-progress: true

jobs:
  refresh:
    name: Generate privacy-safe aggregate cards
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out profile repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Generate metrics
        run: node scripts/update-profile.mjs
        env:
          PROFILE_LOGIN: ${{ vars.PROFILE_LOGIN || github.repository_owner }}
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit changed cards
        shell: bash
        run: |
          if git diff --quiet -- assets/profile-stats-light.svg assets/profile-stats-dark.svg; then
            echo "Profile metrics are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile-stats-light.svg assets/profile-stats-dark.svg
          git commit -m "chore(profile): refresh aggregate metrics"
          git push
